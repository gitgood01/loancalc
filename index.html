<!DOCTYPE html>
<html>
<head>
<title>Loan Payment Calculator</title>
<script>
function loan() {
let PV = document.getElementById("pv").value;
let n = document.getElementById("yr").value;
let r = document.getElementById("ir").value;
let P = ((r/100/12) * PV) / (1-(1+(r/100/12))**-(n*12));
document.getElementById("ans").innerHTML = P.toFixed(2);
}


</script>
  
</head>
<body>

<h3>Loan Payment Calculator</h3>
<p> <input id="pv"> Amount you want to borrow? <br>
<input id="yr"> Years? <br>
<input id="ir">% - Annual interest rate <br>

<button onclick="loan()"> Calculate your monthly payment </button>

</p>
<p>When borrowing <span id="pv"> for <span id="yr"> years at a <span id="ir">% interest rate, your monthly payment will be $<span id="ans">_________</span></p>
  
</body>
</html>
